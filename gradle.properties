group = dev.qixils.crowdcontrol.plugin
version = 4.6.4-SNAPSHOT
java_version = 21

# increase available memory
org.gradle.jvmargs=-Xmx2G
loom.allowMismatchedPlatformVersion = true

# Common
minecraft_version=1.21.5
mod_name=Crowd Control
mod_author=qixils
mod_id=crowdcontrol
license=MIT
credits=
description=The Ultimate Interactive Experience for Streamers
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.5-20250325.162830
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
#parchment_minecraft=1.21.11
#parchment_version=2025.12.20
brigadier_version=1.3.10

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.128.2+1.21.5
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.5.101
neoforge_loader_version_range=[4,)

# mojmap variables
# multiloader: Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.
adventurePlatformModVersion=6.4.0
luckPermsVersion=5.5
# omit `-fabric`, it is added in usages
yaclVersion=3.8.2+1.21.5

# variables
crowdControlVersion=1.3.1
adventureVersion=4.17.0
configurateVersion=4.2.0
nettyVersion=4.1.118.Final
slf4jVersion=2.0.16
jacksonVersion=2.18.0
# minecraft 1.21.2 through 1.21.10 ship Jackson, so we can use theirs instead of bundling our own
bundleJackson=false
geantyrefVersion=2.0.0
